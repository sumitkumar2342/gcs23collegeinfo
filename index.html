<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Profile Access</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #f3f4f6; padding-bottom: 90px; }
        .container { max-width: 950px; margin: 30px auto; padding: 0 15px; }
        .card { background: #111827; border-radius: 12px; border: 1px solid #374151; padding: 30px; margin-bottom: 25px; }
        .lock-box { text-align: center; padding: 30px 15px; }
        .lock-icon { font-size: 50px; margin-bottom: 12px; }
        .lock-title { font-size: 22px; color: #38bdf8; font-weight: 700; margin-bottom: 8px; }
        .lock-desc { font-size: 14px; color: #9ca3af; margin-bottom: 25px; line-height: 1.6; }
        .form-group { margin-bottom: 18px; text-align: left; max-width: 420px; margin-left: auto; margin-right: auto; }
        label { display: block; font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 6px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 12px 14px; background: #1f2937; color: #ffffff; border: 1px solid #374151; border-radius: 6px; font-size: 14px; outline: none; }
        input[type="text"]:focus, input[type="email"]:focus { border-color: #0ea5e9; }
        .btn-submit { background: #0ea5e9; color: #000; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; width: 100%; max-width: 420px; transition: 0.2s; }
        .btn-submit:hover { background: #38bdf8; }
        .toggle-text-btn { margin-top: 20px; font-size: 13px; color: #38bdf8; background: none; border: none; cursor: pointer; text-decoration: underline; font-weight: 600; display: inline-block; }
        .toggle-text-btn:hover { color: #fff; }
        .back-link-btn { margin-top: 15px; font-size: 13px; color: #9ca3af; background: none; border: none; cursor: pointer; font-weight: 600; }
        .back-link-btn:hover { color: #38bdf8; }
        
        /* Dashboard Styles */
        .profile-header { display: flex; gap: 25px; align-items: center; border-bottom: 2px solid #374151; padding-bottom: 20px; margin-bottom: 20px; }
        .photo-box { width: 110px; height: 130px; border: 2px solid #0ea5e9; background: #1f2937; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .profile-info h1 { font-size: 24px; color: #38bdf8; font-weight: 700; }
        .profile-info p { font-size: 13.5px; color: #9ca3af; margin-top: 4px; }
        .sec-title-wrapper { border-bottom: 2px solid #374151; padding-bottom: 6px; margin-bottom: 12px; }
        .sec-title { font-size: 16px; color: #38bdf8; font-weight: 700; text-transform: uppercase; }
        .sec-content { font-size: 14px; line-height: 1.6; color: #d1d5db; margin-bottom: 20px; }
        
        /* Navigation */
        .instagram-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111827; border-top: 1px solid #374151; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; text-decoration: none; font-size: 11px; font-weight: 500; cursor: pointer; background: none; border: none; }
        .nav-item span.icon { font-size: 20px; margin-bottom: 2px; }
        .nav-item:hover, .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login & Request Forms -->
        <div id="authCard" class="card lock-box">
            <div id="requestFormWrapper">
                <div class="lock-icon">🔒</div>
                <div class="lock-title">Restricted Profile Access</div>
                <div class="lock-desc">Please fill out your details below to request profile access.</div>
                <form id="accessForm">
                    <div class="form-group">
                        <label>HR Representative Name:</label>
                        <input type="text" id="user_name" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label>Company Email:</label>
                        <input type="email" id="user_company" required placeholder="Enter your email address">
                    </div>
                    <button type="submit" class="btn-submit">Request Access ➔</button>
                </form>
                <button type="button" class="toggle-text-btn" onclick="showLoginForm()">Already have permission? Login here</button>
            </div>

            <div id="loginFormWrapper" style="display: none;">
                <div class="lock-icon">🔑</div>
                <div class="lock-title">Login with Permission</div>
                <div class="lock-desc">Enter your approved Name and Email to view the profile.</div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Registered Name:</label>
                        <input type="text" id="login_name" required placeholder="Enter your registered name">
                    </div>
                    <div class="form-group">
                        <label>Registered Email:</label>
                        <input type="email" id="login_email" required placeholder="Enter your registered email">
                    </div>
                    <button type="submit" class="btn-submit">Login Now ➔</button>
                </form>
                <button type="button" class="back-link-btn" onclick="showRequestForm()">← Back to Request</button>
            </div>
        </div>

        <!-- Dashboard (Hidden by default) -->
        <div id="dashboardCard" class="card" style="display: none;">
            <div class="profile-header">
                <div class="photo-box">
                    <img src="photo.jpg" alt="Profile Photo" style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <div class="profile-info">
                    <h1 id="profName">Loading...</h1>
                    <p id="profContact">Loading...</p>
                </div>
            </div>
            <div class="sec-title-wrapper"><div class="sec-title">Career Objective</div></div>
            <div id="profObjective" class="sec-content">Loading...</div>
            
            <div class="sec-title-wrapper"><div class="sec-title">Educational Qualification</div></div>
            <div id="profEducation" class="sec-content">Loading...</div>

            <div class="sec-title-wrapper"><div class="sec-title">Key Skills</div></div>
            <div id="profSkills" class="sec-content">Loading...</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="instagram-nav">
        <button class="nav-item active" onclick="showSection('home')"><span class="icon">🏠</span>Home</button>
        <button class="nav-item" onclick="alert('Chat feature requires Supabase setup.')"><span class="icon">💬</span>Chat</button>
        <button class="nav-item" onclick="logout()"><span class="icon">🚪</span>Exit</button>
    </div>

    <script>
        function showLoginForm() {
            document.getElementById('requestFormWrapper').style.display = 'none';
            document.getElementById('loginFormWrapper').style.display = 'block';
        }
        function showRequestForm() {
            document.getElementById('loginFormWrapper').style.display = 'none';
            document.getElementById('requestFormWrapper').style.display = 'block';
        }
        function showSection(section) {
            // Navigation logic can be added here
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // यहाँ Supabase ऑथेंटिकेशन का कोड आएगा
            // सफलता के बाद:
            document.getElementById('authCard').style.display = 'none';
            document.getElementById('dashboardCard').style.display = 'block';
            loadProfileData();
        });

        function loadProfileData() {
            // यहाँ Supabase से डेटा लोड करने का कोड आएगा
            document.getElementById('profName').innerText = "Roshan Singh";
            document.getElementById('profContact').innerText = "roshan20050320@gmail.com | 7428685871";
            document.getElementById('profObjective').innerText = "Motivated fresher seeking a Telecaller role...";
            document.getElementById('profEducation').innerText = "12th | 2023 | 60% | SBV BLOCK MANGOLPURI SCHOOL";
            document.getElementById('profSkills').innerText = "Call Handling, Customer Communication...";
        }

        function logout() {
            document.getElementById('authCard').style.display = 'block';
            document.getElementById('dashboardCard').style.display = 'none';
            showRequestForm();
        }
    </script>
</body>
</html>
